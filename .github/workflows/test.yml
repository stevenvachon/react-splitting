on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  Test:
    name: Run build, tests, and upload coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Upload results to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: stevenvachon/react-splitting
